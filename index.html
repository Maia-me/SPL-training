<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPL Trainer — Sailplane Theory Exam Prep</title>
<style>
  :root{
    --navy-950:#0b1626;
    --navy-900:#0f1e33;
    --navy-800:#15283f;
    --navy-700:#1c344f;
    --navy-600:#274769;
    --paper:#eef1f0;
    --paper-dim:#b9c4ce;
    --amber:#e8a33d;
    --amber-dim:#c98a2e;
    --teal:#4fae8e;
    --rust:#c1543f;
    --rule:#2a3f5c;
    --mono: "IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --sans: "IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-950);
    color:var(--paper);
    font-family:var(--sans);
    min-height:100vh;
    line-height:1.5;
  }
  a{color:var(--amber);}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--rule);
    background:linear-gradient(180deg,var(--navy-900),var(--navy-950));
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand-mark{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.12em;
    color:var(--amber);
    border:1px solid var(--amber-dim);
    padding:2px 7px;
    border-radius:3px;
  }
  .brand-name{
    font-weight:600;
    font-size:18px;
    letter-spacing:.01em;
  }
  .score-pill{
    font-family:var(--mono);
    font-size:13px;
    color:var(--paper-dim);
    display:flex;
    gap:16px;
  }
  .score-pill b{color:var(--paper);font-weight:600;}
  .score-pill .correct{color:var(--teal);}
  .score-pill .incorrect{color:var(--rust);}

  /* ---------- layout ---------- */
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:32px 20px 80px;
  }

  /* ---------- subject picker ---------- */
  .intro h1{
    font-size:26px;
    margin:6px 0 6px;
    font-weight:650;
  }
  .intro p{
    color:var(--paper-dim);
    margin:0 0 28px;
    max-width:58ch;
  }
  .subject-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media(max-width:560px){ .subject-grid{grid-template-columns:1fr;} }

  .subject-card{
    background:var(--navy-900);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:16px 16px;
    text-align:left;
    cursor:pointer;
    color:var(--paper);
    font-family:var(--sans);
    transition:border-color .15s ease, transform .1s ease;
    position:relative;
    overflow:hidden;
  }
  .subject-card:hover{
    border-color:var(--amber-dim);
  }
  .subject-card:active{ transform:scale(.99); }
  .subject-code{
    font-family:var(--mono);
    font-size:11px;
    color:var(--amber);
    letter-spacing:.08em;
  }
  .subject-title{
    font-size:15px;
    font-weight:600;
    margin-top:4px;
  }
  .subject-count{
    font-family:var(--mono);
    font-size:12px;
    color:var(--paper-dim);
    margin-top:8px;
  }
  .subject-card.all{
    grid-column:1 / -1;
    background:linear-gradient(135deg,var(--navy-800),var(--navy-700));
    border-color:var(--amber-dim);
  }

  /* ---------- quiz screen ---------- */
  .quiz-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .back-link{
    font-family:var(--mono);
    font-size:12px;
    color:var(--paper-dim);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px 0;
  }
  .back-link:hover{ color:var(--amber); }
  .progress-tag{
    font-family:var(--mono);
    font-size:12px;
    color:var(--paper-dim);
  }

  .qcard{
    background:var(--navy-900);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:24px 24px 22px;
  }
  .qmeta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .qsubject{
    font-family:var(--mono);
    font-size:11px;
    color:var(--amber);
    letter-spacing:.08em;
  }
  .qpoints{
    font-family:var(--mono);
    font-size:11px;
    color:var(--paper-dim);
  }
  .qtext{
    font-size:17px;
    line-height:1.55;
    white-space:pre-line;
    margin:0 0 16px;
  }
  .qimage{
    margin:0 0 18px;
    border:1px solid var(--rule);
    border-radius:4px;
    overflow:hidden;
    background:#fff;
  }
  .qimage img{
    display:block;
    width:100%;
    height:auto;
  }
  .qimage-missing{
    font-family:var(--mono);
    font-size:12px;
    color:var(--paper-dim);
    background:var(--navy-800);
    border:1px dashed var(--rule);
    border-radius:4px;
    padding:14px;
    margin:0 0 18px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    background:var(--navy-800);
    border:1px solid var(--rule);
    border-radius:5px;
    padding:12px 14px;
    cursor:pointer;
    color:var(--paper);
    font-family:var(--sans);
    font-size:14.5px;
    line-height:1.4;
    transition:border-color .12s ease, background .12s ease;
  }
  .option:hover:not(.locked){
    border-color:var(--amber-dim);
  }
  .option .opt-letter{
    font-family:var(--mono);
    font-size:12px;
    color:var(--paper-dim);
    border:1px solid var(--rule);
    border-radius:3px;
    width:20px;
    height:20px;
    min-width:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
  }
  .option.correct{
    border-color:var(--teal);
    background:rgba(79,174,142,.12);
  }
  .option.correct .opt-letter{
    border-color:var(--teal);
    color:var(--teal);
  }
  .option.incorrect{
    border-color:var(--rust);
    background:rgba(193,84,63,.12);
  }
  .option.incorrect .opt-letter{
    border-color:var(--rust);
    color:var(--rust);
  }
  .option.locked{
    cursor:default;
  }
  .option.dim{
    opacity:.55;
  }

  .result-banner{
    margin-top:16px;
    padding:14px 16px;
    border-radius:5px;
    font-size:14px;
    line-height:1.55;
  }
  .result-banner.correct{
    background:rgba(79,174,142,.1);
    border:1px solid var(--teal);
  }
  .result-banner.incorrect{
    background:rgba(193,84,63,.1);
    border:1px solid var(--rust);
  }
  .result-title{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    margin-bottom:6px;
  }
  .result-banner.correct .result-title{ color:var(--teal); }
  .result-banner.incorrect .result-title{ color:var(--rust); }
  .result-explanation{ color:var(--paper); }
  .result-note{
    margin-top:8px;
    font-size:12px;
    color:var(--paper-dim);
    font-style:italic;
  }

  .next-row{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
  }
  .next-btn{
    font-family:var(--sans);
    font-weight:600;
    font-size:14px;
    background:var(--amber);
    color:var(--navy-950);
    border:none;
    border-radius:5px;
    padding:11px 20px;
    cursor:pointer;
  }
  .next-btn:hover{ background:#f0b355; }

  /* ---------- summary screen ---------- */
  .summary{
    text-align:center;
    padding:40px 0;
  }
  .summary .big{
    font-family:var(--mono);
    font-size:52px;
    color:var(--amber);
    font-weight:600;
  }
  .summary .sub{
    color:var(--paper-dim);
    margin-top:6px;
  }
  .summary-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:26px;
  }
  .ghost-btn{
    font-family:var(--sans);
    font-size:14px;
    background:transparent;
    color:var(--paper);
    border:1px solid var(--rule);
    border-radius:5px;
    padding:10px 18px;
    cursor:pointer;
  }
  .ghost-btn:hover{ border-color:var(--amber-dim); }

  .hidden{ display:none !important; }

  footer{
    text-align:center;
    color:var(--paper-dim);
    font-family:var(--mono);
    font-size:11px;
    padding:30px 20px 10px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-mark">SPL</span>
    <span class="brand-name">Theory Trainer</span>
  </div>
  <div class="score-pill" id="scorePill"></div>
</div>

<div class="wrap">

  <!-- SUBJECT PICKER -->
  <div id="screenPicker">
    <div class="intro">
      <h1>Choose a subject</h1>
      <p>Questions are drawn at random from the official SPL question bank. Every answer is checked instantly, and a short explanation appears if you get one wrong.</p>
    </div>
    <div class="subject-grid" id="subjectGrid"></div>
  </div>

  <!-- QUIZ -->
  <div id="screenQuiz" class="hidden">
    <div class="quiz-header">
      <button class="back-link" id="backBtn">&larr; subjects</button>
      <span class="progress-tag" id="progressTag"></span>
    </div>
    <div class="qcard" id="qcard"></div>
  </div>

  <!-- SUMMARY -->
  <div id="screenSummary" class="hidden">
    <div class="summary">
      <div class="big" id="summaryScore"></div>
      <div class="sub" id="summarySub"></div>
      <div class="summary-actions">
        <button class="next-btn" id="retryBtn">Practice again</button>
        <button class="ghost-btn" id="homeBtn">Choose another subject</button>
      </div>
    </div>
  </div>

</div>

<footer>ECQB-PPL SPL question bank &middot; local practice tool, not an official exam</footer>

<script>
const ROUND_LENGTH = 15; // questions per practice round

let ALL_QUESTIONS = [];
let SUBJECTS = []; // [{code, name, count}]
let currentPool = [];
let currentIndex = 0;
let currentAnswered = false;
let sessionCorrect = 0;
let sessionTotal = 0;
let roundCorrect = 0;

const screenPicker = document.getElementById('screenPicker');
const screenQuiz = document.getElementById('screenQuiz');
const screenSummary = document.getElementById('screenSummary');
const subjectGrid = document.getElementById('subjectGrid');
const qcard = document.getElementById('qcard');
const progressTag = document.getElementById('progressTag');
const scorePill = document.getElementById('scorePill');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function updateScorePill(){
  if(sessionTotal === 0){ scorePill.innerHTML = ''; return; }
  scorePill.innerHTML =
    `<span>Session <b>${sessionTotal}</b></span>` +
    `<span class="correct">&#10003; ${sessionCorrect}</span>` +
    `<span class="incorrect">&#10007; ${sessionTotal - sessionCorrect}</span>`;
}

async function init(){
  const res = await fetch('questions.json');
  ALL_QUESTIONS = await res.json();

  const bySubject = {};
  for(const q of ALL_QUESTIONS){
    if(!bySubject[q.subject_code]){
      bySubject[q.subject_code] = {code:q.subject_code, name:q.subject, count:0};
    }
    bySubject[q.subject_code].count++;
  }
  SUBJECTS = Object.values(bySubject).sort((a,b)=>a.code.localeCompare(b.code));

  renderSubjectGrid();
}

function renderSubjectGrid(){
  subjectGrid.innerHTML = '';

  const allCard = document.createElement('button');
  allCard.className = 'subject-card all';
  allCard.innerHTML = `
    <div class="subject-code">ALL SUBJECTS</div>
    <div class="subject-title">Mixed practice</div>
    <div class="subject-count">${ALL_QUESTIONS.length} questions total</div>
  `;
  allCard.onclick = () => startRound(null);
  subjectGrid.appendChild(allCard);

  for(const s of SUBJECTS){
    const card = document.createElement('button');
    card.className = 'subject-card';
    card.innerHTML = `
      <div class="subject-code">${s.code}</div>
      <div class="subject-title">${s.name}</div>
      <div class="subject-count">${s.count} questions</div>
    `;
    card.onclick = () => startRound(s.code);
    subjectGrid.appendChild(card);
  }
}

function startRound(subjectCode){
  const source = subjectCode ? ALL_QUESTIONS.filter(q=>q.subject_code===subjectCode) : ALL_QUESTIONS;
  const n = Math.min(ROUND_LENGTH, source.length);
  currentPool = shuffle(source).slice(0, n);
  currentIndex = 0;
  roundCorrect = 0;

  screenPicker.classList.add('hidden');
  screenSummary.classList.add('hidden');
  screenQuiz.classList.remove('hidden');

  renderQuestion();
}

function renderQuestion(){
  currentAnswered = false;
  const q = currentPool[currentIndex];
  progressTag.textContent = `${currentIndex+1} / ${currentPool.length}`;

  const opts = [
    {letter:'A', text:q.option_a},
    {letter:'B', text:q.option_b},
    {letter:'C', text:q.option_c},
    {letter:'D', text:q.option_d},
  ];

  let imageHtml = '';
  if(q.annex_reference){
    if(q.image_available && q.image_file){
      imageHtml = `<div class="qimage"><img src="${q.image_file}" alt="Figure for this question"></div>`;
    } else {
      imageHtml = `<div class="qimage-missing">Figure not available in this excerpt of the question bank.${q.image_note ? ' ' + q.image_note : ''}</div>`;
    }
  }

  qcard.innerHTML = `
    <div class="qmeta">
      <span class="qsubject">${q.subject_code}</span>
      <span class="qpoints">${q.points ? q.points + ' pt' : ''}</span>
    </div>
    <p class="qtext"></p>
    ${imageHtml}
    <div class="options" id="optionsList"></div>
    <div id="resultArea"></div>
    <div class="next-row hidden" id="nextRow">
      <button class="next-btn" id="nextBtn">Next question &rarr;</button>
    </div>
  `;
  qcard.querySelector('.qtext').textContent = cleanQuestionText(q.question);

  const optionsList = document.getElementById('optionsList');
  opts.forEach(o=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="opt-letter">${o.letter}</span><span>${escapeHtml(o.text)}</span>`;
    btn.onclick = () => selectAnswer(o.letter, q);
    optionsList.appendChild(btn);
  });

  document.getElementById('nextBtn').onclick = () => {
    currentIndex++;
    if(currentIndex >= currentPool.length){
      showSummary();
    } else {
      renderQuestion();
    }
  };
}

function cleanQuestionText(text){
  // Strip the "See figure/annex (...)" and "Siehe Anlage N" lines from display
  // since the image (or missing-image note) already conveys that.
  return text
    .split('\n')
    .filter(line => !/^See (figure|annex)\s*\(/i.test(line.trim()) && !/^Siehe Anlage/i.test(line.trim()))
    .join('\n')
    .trim();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function selectAnswer(letter, q){
  if(currentAnswered) return;
  currentAnswered = true;

  const isCorrect = letter === q.correct_option;
  sessionTotal++;
  if(isCorrect){ sessionCorrect++; roundCorrect++; }
  updateScorePill();

  const buttons = document.querySelectorAll('#optionsList .option');
  buttons.forEach((btn, i) => {
    const optLetter = 'ABCD'[i];
    btn.classList.add('locked');
    if(optLetter === q.correct_option){
      btn.classList.add('correct');
    } else if(optLetter === letter){
      btn.classList.add('incorrect');
    } else {
      btn.classList.add('dim');
    }
  });

  const resultArea = document.getElementById('resultArea');
  if(isCorrect){
    resultArea.innerHTML = `
      <div class="result-banner correct">
        <div class="result-title">CORRECT</div>
        <div class="result-explanation">Well done.</div>
      </div>
    `;
  } else {
    const correctText = q['option_' + q.correct_option.toLowerCase()];
    resultArea.innerHTML = `
      <div class="result-banner incorrect">
        <div class="result-title">NOT QUITE</div>
        <div class="result-explanation"><strong>Correct answer (${q.correct_option}):</strong> ${escapeHtml(correctText)}<br><br>${escapeHtml(q.explanation || '')}</div>
      </div>
    `;
  }

  document.getElementById('nextRow').classList.remove('hidden');
}

function showSummary(){
  screenQuiz.classList.add('hidden');
  screenSummary.classList.remove('hidden');
  document.getElementById('summaryScore').textContent = `${roundCorrect} / ${currentPool.length}`;
  document.getElementById('summarySub').textContent = 'correct this round';
}

document.getElementById('backBtn').onclick = () => {
  screenQuiz.classList.add('hidden');
  screenPicker.classList.remove('hidden');
};
document.getElementById('retryBtn').onclick = () => {
  const subjectCode = currentPool.length && currentPool.every(q=>q.subject_code===currentPool[0].subject_code)
    ? currentPool[0].subject_code : null;
  startRound(subjectCode);
};
document.getElementById('homeBtn').onclick = () => {
  screenSummary.classList.add('hidden');
  screenPicker.classList.remove('hidden');
};

init();
</script>

</body>
</html>
